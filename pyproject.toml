[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ag-sae"
version = "0.1.0"
description = "Sparse autoencoders on AlphaGenome activations: concept matching and interventions."
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2", "scipy>=1.13", "pyarrow>=17"]

[project.optional-dependencies]
figures = ["matplotlib>=3.9", "logomaker>=0.8"]

torch = ["torch>=2.4"]
dev = ["pytest>=8.0", "matplotlib>=3.9", "logomaker>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["ag_sae"]

[tool.pytest.ini_options]
testpaths = ["tests"]
